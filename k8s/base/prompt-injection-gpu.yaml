apiVersion: apps/v1
kind: Deployment
metadata:
  name: prompt-injection-gpu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prompt-injection-gpu
  template:
    metadata:
      labels:
        app: prompt-injection-gpu
    spec:
      initContainers:
        - name: model-downloader
          image: python:3.11-slim
          command:
            - /bin/sh
            - -c
            - |
              pip install --no-cache-dir transformers torch && \
              python -c "from transformers import pipeline; pipeline('text-classification', model='protectai/deberta-v3-base-prompt-injection', cache_dir='/models')"
          volumeMounts:
            - name: model-cache
              mountPath: /models
      containers:
        - name: prompt-injection-service
          image: prompt-injection-service:latest
          imagePullPolicy: Never
          env:
            - name: SERVICE_TYPE
              value: "gpu"
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          volumeMounts:
            - name: model-cache
              mountPath: /models
      nodeSelector:
        accelerator: nvidia-gpu
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: prompt-injection-model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: prompt-injection-gpu-service
spec:
  selector:
    app: prompt-injection-gpu
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
