apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gaas-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/duyk16/argocd-demo-app.git
    targetRevision: gaas-project
    path: k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
